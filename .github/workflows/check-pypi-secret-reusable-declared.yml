name: Check release secret (reusable, declared)

on:
  workflow_call:
    secrets:
      PYPI_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: release
    env:
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - name: Check token availability
        env:
          STEP_HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        shell: bash
        run: |
          printf 'Job-level: %s\n' "$HAS_PYPI_TOKEN"
          printf 'Step-level: %s\n' "$STEP_HAS_PYPI_TOKEN"
