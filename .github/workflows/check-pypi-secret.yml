name: Check release secret

on:
  workflow_dispatch:
  push:
    branches: [epmcdme-16232-v19]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check token availability
        env:
          TOKEN_PRESENT: ${{ secrets.PYPI_API_TOKEN != '' }}
        shell: bash
        run: |
          printf 'Release token present: %s\n' "$TOKEN_PRESENT"

  probe-reusable:
    uses: ./.github/workflows/check-pypi-secret-reusable.yml
